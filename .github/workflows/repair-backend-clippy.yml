name: Repair backend lint branch

on:
  push:
    branches:
      - extract-rune-lanes-core-cqrs

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: extract-rune-lanes-core-cqrs

      - name: Repair strict clippy findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ai_path = Path('backend/src/ai_lab.rs')
          ai = ai_path.read_text()
          old = '''        match &mut card.kind {
              CardKind::Unit {
                  attack,
                  armor,
                  max_ap,
              } => {
                  if let Some(value) = override_.attack {
                      *attack = value;
                  }
                  if let Some(value) = override_.armor {
                      *armor = value;
                  }
                  if let Some(value) = override_.max_ap {
                      *max_ap = value;
                  }
              }
              _ => {}
          }
          '''
          new = '''        if let CardKind::Unit {
              attack,
              armor,
              max_ap,
          } = &mut card.kind
          {
              if let Some(value) = override_.attack {
                  *attack = value;
              }
              if let Some(value) = override_.armor {
                  *armor = value;
              }
              if let Some(value) = override_.max_ap {
                  *max_ap = value;
              }
          }
          '''
          if old not in ai:
              raise SystemExit('AI override match not found')
          ai_path.write_text(ai.replace(old, new, 1))

          identity_path = Path('backend/src/identity.rs')
          identity = identity_path.read_text()
          old = '''fn random_hex_token(byte_count: usize) -> String {
              let mut bytes = vec![0_u8; byte_count];
              OsRng.fill_bytes(&mut bytes);
              bytes
                  .into_iter()
                  .map(|byte| format!("{byte:02x}"))
                  .collect()
          }
          '''
          new = '''fn random_hex_token(byte_count: usize) -> String {
              use std::fmt::Write as _;

              let mut bytes = vec![0_u8; byte_count];
              OsRng.fill_bytes(&mut bytes);
              bytes.into_iter().fold(
                  String::with_capacity(byte_count.saturating_mul(2)),
                  |mut token, byte| {
                      write!(&mut token, "{byte:02x}").expect("writing to String cannot fail");
                      token
                  },
              )
          }
          '''
          if old not in identity:
              raise SystemExit('random_hex_token block not found')
          identity_path.write_text(identity.replace(old, new, 1))

          progression_path = Path('backend/src/progression.rs')
          progression = progression_path.read_text()
          replacements = {
              '''#[derive(Clone, Debug, Deserialize)]
          #[serde(rename_all = "camelCase")]
          pub struct SaveHeroAppearanceRequest {''': '''#[allow(
              dead_code,
              reason = "hero appearance persistence is implemented and covered but not yet exposed by a production route"
          )]
          #[derive(Clone, Debug, Deserialize)]
          #[serde(rename_all = "camelCase")]
          pub struct SaveHeroAppearanceRequest {''',
              '''pub fn default_hero_appearance_id(hero_type: HeroType) -> String {''': '''#[allow(
              dead_code,
              reason = "kept for the staged hero appearance API until match setup consumes it"
          )]
          pub fn default_hero_appearance_id(hero_type: HeroType) -> String {''',
              '''    pub fn save_hero_appearance_selection(
          ''': '''    #[allow(
              dead_code,
              reason = "hero appearance persistence is implemented and covered but not yet exposed by a production route"
          )]
              pub fn save_hero_appearance_selection(
          ''',
              '''    pub fn selected_hero_appearance_id(
          ''': '''    #[allow(
              dead_code,
              reason = "kept for the staged hero appearance API until match setup consumes it"
          )]
              pub fn selected_hero_appearance_id(
          ''',
          }
          for old, new in replacements.items():
              if old not in progression:
                  raise SystemExit(f'progression marker not found: {old!r}')
              progression = progression.replace(old, new, 1)
          progression_path.write_text(progression)

          catalog_path = Path('backend/src/progression/catalog.rs')
          catalog = catalog_path.read_text()
          for signature in (
              'pub(super) fn hero_appearance_definition(\n',
              'pub(super) fn hero_appearance_definition_any(\n',
          ):
              if signature not in catalog:
                  raise SystemExit(f'catalog marker not found: {signature!r}')
              catalog = catalog.replace(
                  signature,
                  '#[allow(dead_code, reason = "used by the staged hero appearance persistence API")]\n' + signature,
                  1,
              )
          catalog_path.write_text(catalog)
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy

      - name: Validate Rust workspace
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/ai_lab.rs backend/src/identity.rs backend/src/progression.rs backend/src/progression/catalog.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix(backend): satisfy strict workspace clippy'
          git push origin HEAD:extract-rune-lanes-core-cqrs
