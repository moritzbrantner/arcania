name: Repair PR 134 acceptance

on:
  push:
    branches:
      - extract-rune-lanes-core-cqrs

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: extract-rune-lanes-core-cqrs
          fetch-depth: 0

      - name: Apply narrow acceptance repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('e2e/auth-routes.spec.js')
          text = auth.read_text()
          old = '  await expect(page.getByRole("button", { name: "Sign In" })).toBeVisible();\n  await expect\n    .poll(() => page.evaluate((key) => localStorage.getItem(key), AUTH_TOKEN_STORAGE_KEY))'
          new = '  await expect(page.getByRole("button", { name: "Sign In", exact: true })).toBeVisible();\n  await expect\n    .poll(() => page.evaluate((key) => localStorage.getItem(key), AUTH_TOKEN_STORAGE_KEY))'
          if old not in text:
              raise SystemExit('sign-out assertion marker not found')
          auth.write_text(text.replace(old, new, 1))

          css = Path('frontend/src/styles/match-mobile-fixes.css')
          css.write_text('''@media (min-width: 721px) and (max-width: 1320px) {
  .opponent-hand-display {
    min-width: 172px;
  }
}

@media (max-width: 520px) {
  .battlefield-hud-opponent,
  .battlefield-hud-phase {
    box-sizing: border-box;
  }
}
''')
          PY

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build frontend
        run: bun run --cwd frontend build

      - name: Verify repaired acceptance
        run: ./node_modules/.bin/playwright test e2e/auth-routes.spec.js e2e/shared-settings-cursor.spec.js --workers=1

      - name: Publish repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/repair-pr134-ci.yml
          git add -A
          git commit -m 'fix: repair core extraction acceptance'
          git push origin HEAD:extract-rune-lanes-core-cqrs
