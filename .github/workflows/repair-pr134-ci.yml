name: Repair PR 134 acceptance

on:
  push:
    branches:
      - extract-rune-lanes-core-cqrs

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: extract-rune-lanes-core-cqrs
          fetch-depth: 0

      - name: Apply and publish narrow acceptance repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('e2e/auth-routes.spec.js')
          text = auth.read_text()
          old = '  await expect(page.getByRole("button", { name: "Sign In" })).toBeVisible();\n  await expect\n    .poll(() => page.evaluate((key) => localStorage.getItem(key), AUTH_TOKEN_STORAGE_KEY))'
          new = '  await expect(page.getByRole("button", { name: "Sign In", exact: true })).toBeVisible();\n  await expect\n    .poll(() => page.evaluate((key) => localStorage.getItem(key), AUTH_TOKEN_STORAGE_KEY))'
          if old not in text:
              raise SystemExit('sign-out assertion marker not found')
          auth.write_text(text.replace(old, new, 1))

          css = Path('frontend/src/styles/match-mobile-fixes.css')
          css.write_text(
              '@media (min-width: 721px) and (max-width: 1320px) {\n'
              '  .opponent-hand-display {\n'
              '    min-width: 172px;\n'
              '  }\n'
              '}\n\n'
              '@media (max-width: 520px) {\n'
              '  .battlefield-hud-opponent,\n'
              '  .battlefield-hud-phase {\n'
              '    box-sizing: border-box;\n'
              '  }\n'
              '}\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/repair-pr134-ci.yml
          git add -A
          git commit -m 'fix: repair core extraction acceptance'
          git push origin HEAD:extract-rune-lanes-core-cqrs
