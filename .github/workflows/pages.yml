name: GitHub Pages

on:
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify frontend
        run: |
          bun run --cwd frontend typecheck
          bun run --cwd frontend test:unit

      - name: Build Pages site
        env:
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_DISABLE_BACKEND_PROXY: "1"
        run: |
          bun run --cwd frontend build
          cp frontend/dist/index.html frontend/dist/404.html

      - name: Verify Pages artifact
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/404.html
          grep -F "${PAGES_BASE_PATH}assets/" frontend/dist/index.html
          cmp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
