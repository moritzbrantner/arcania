name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run local CI
        run: bun run ci:local

      - name: Commit resolved Cargo lock
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          sha="$(gh api "repos/$REPOSITORY/contents/Cargo.lock?ref=$HEAD_BRANCH" --jq .sha)"
          content="$(base64 -w0 Cargo.lock)"
          gh api --method PUT "repos/$REPOSITORY/contents/Cargo.lock" \
            -f message='Refresh Cargo lock for game-server integration' \
            -f content="$content" \
            -f sha="$sha" \
            -f branch="$HEAD_BRANCH"
