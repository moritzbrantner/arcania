name: Regenerate Cargo Lockfile

on:
  push:
    branches:
      - adopt-settings-input-bindings

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: adopt-settings-input-bindings
      - uses: dtolnay/rust-toolchain@1.85
      - name: Resolve manifest against existing lockfile
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update Cargo lockfile for settings-core"
          git push origin HEAD:adopt-settings-input-bindings
