name: Complete event-store migration

on:
  push:
    branches:
      - event-sourced-rune-lanes-match

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: event-sourced-rune-lanes-match
          fetch-depth: 0

      - name: Apply SQLite event-store migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          historical = subprocess.check_output([
              'git', 'show',
              'e6ef6bf09a2416ec42b2eee95540c82e6b32672e:.github/workflows/restack-event-sourcing.yml'
          ], text=True)
          marker = "          python3 - <<'PY'\n"
          start = historical.index(marker) + len(marker)
          end = historical.index("\n          PY", start)
          lines = historical[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          helper_start = script.index('def replace_once(')
          helper_end = script.index('\n\n# Core event model:', helper_start)
          helper = '\n'.join([
              'def replace_once(text: str, old: str, new: str, label: str) -> str:',
              '    if old in text:',
              '        return text.replace(old, new, 1)',
              '    tokens = [line.strip() for line in old.strip().splitlines() if line.strip()]',
              "    pattern = r'\\s*'.join(re.escape(token) for token in tokens)",
              '    match = re.search(pattern, text, flags=re.DOTALL)',
              '    if match is None:',
              "        raise SystemExit(f'{label} marker not found')",
              "    return text[:match.start()] + new.strip('\\n') + text[match.end():]",
              '',
          ])
          script = script[:helper_start] + helper + script[helper_end:]
          exec(compile(script, 'event-store-migration.py', 'exec'))

          path = Path('backend/src/match_store/event_store.rs')
          text = path.read_text()
          text = text.replace(
              "let MatchEvent::Created {\n          next_action_index,\n          ..\n      } = first.event\n      else {",
              "let MatchEvent::Created {\n          next_action_index,\n          ..\n      } = &first.event\n      else {",
          )
          text = text.replace('let mut next = next_action_index;', 'let mut next = *next_action_index;')
          text = text.replace('params![id, aggregate_snapshot.state_snapshot_json],', 'params![id, &aggregate_snapshot.state_snapshot_json],')
          text = text.replace('params![created.id]', 'params![&created.id]')
          path.write_text(text)
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy

      - name: Format migration
        run: cargo fmt --all

      - name: Validate migration
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo test -p rune-lanes-core event_sourcing &&
            cargo test -p backend match_commands &&
            cargo test -p backend event_store &&
            cargo test -p backend &&
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          } 2>&1 | tee migration-validation.log

      - name: Publish validated migration
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/restack-event-sourcing.yml
          rm .github/workflows/repair-event-migration.yml
          rm -f migration-validation.log
          git add -A
          git commit -m 'feat: persist Rune Lanes matches as SQLite event streams'
          git push origin HEAD:event-sourced-rune-lanes-match

      - name: Publish validation evidence on failure
        if: steps.validate.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'wip: surface event-store migration validation failure'
          git push origin HEAD:event-sourced-rune-lanes-match
          exit 1
