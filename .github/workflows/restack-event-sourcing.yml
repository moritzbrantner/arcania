name: Complete event-store migration

on:
  push:
    branches:
      - event-sourced-rune-lanes-match

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: event-sourced-rune-lanes-match
          fetch-depth: 0

      - name: Apply SQLite event-store migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} marker not found')
              return text.replace(old, new, 1)

          # Core event model: keep command idempotency ahead of version checks,
          # record the projection-index migration base in genesis, and model
          # forfeit / AI-turn completion as core-owned facts.
          path = Path('rune-lanes-core/src/event_sourcing.rs')
          text = path.read_text()
          old = '''    Created {
              initial_snapshot_json: String,
          },
          /// Fact that a tabletop command was accepted by the pinned ruleset.
          /// Rehydration evolves this event by deterministically replaying the command;
          /// it never re-runs application/auth/transport decisions.
          CommandAccepted {
              command_id: CommandId,
              side: Side,
              action_index: u32,
              command: GameCommand,
          },
          '''
          new = '''    Created {
              initial_snapshot_json: String,
              /// Next compatibility projection action index at the migration boundary.
              /// This preserves legacy projection numbering without making action rows
              /// part of authoritative aggregate recovery.
              next_action_index: u32,
          },
          /// Fact that a tabletop command was accepted by the pinned ruleset.
          /// Rehydration evolves this event by deterministically replaying the command;
          /// it never re-runs application/auth/transport decisions.
          CommandAccepted {
              command_id: CommandId,
              side: Side,
              action_index: u32,
              command: GameCommand,
          },
          /// The application established that a disconnected opponent may be forfeited;
          /// the state transition itself remains a core-owned domain fact.
          ForfeitAccepted {
              command_id: CommandId,
              winner: Side,
              action_index: u32,
          },
          /// The solo AI policy selected no further concrete action in card-play.
          /// Scheduling AI remains application orchestration; finishing the turn is a
          /// deterministic core transition recorded as its own fact.
          AiTurnFinished {
              command_id: CommandId,
              side: Side,
              action_index: u32,
          },
          '''
          text = replace_once(text, old, new, 'event variants')

          start = text.index('    pub fn create(\n')
          end = text.index('    pub fn state(&self) -> &MatchState {', start)
          create_block = '''    pub fn create(
              initial_state: MatchState,
          ) -> Result<(Self, EventEnvelope), EventSourcingError> {
              Self::create_migration_genesis(initial_state, 0)
          }

          pub fn create_migration_genesis(
              initial_state: MatchState,
              next_action_index: u32,
          ) -> Result<(Self, EventEnvelope), EventSourcingError> {
              let ruleset_version = RulesetVersion::current();
              let event = EventEnvelope {
                  aggregate_version: AggregateVersion(1),
                  event_schema_version: CURRENT_EVENT_SCHEMA_VERSION,
                  ruleset_version: ruleset_version.clone(),
                  event: MatchEvent::Created {
                      initial_snapshot_json: initial_state.to_snapshot_json()?,
                      next_action_index,
                  },
              };
              let aggregate = Self::rehydrate(std::slice::from_ref(&event))?;
              Ok((aggregate, event))
          }

          '''
          text = text[:start] + create_block + text[end:]

          old_checks = '''        if metadata.expected_version != self.version {
              return Err(EventSourcingError::VersionConflict {
                  expected: metadata.expected_version,
                  actual: self.version,
              });
          }

          if let Some(version) = self.applied_commands.get(&metadata.command_id) {
              return Ok(CommandDecision::AlreadyApplied {
                  aggregate_version: *version,
              });
          }
          '''
          new_checks = '''        if let Some(version) = self.validate_command_metadata(&metadata)? {
              return Ok(CommandDecision::AlreadyApplied {
                  aggregate_version: version,
              });
          }
          '''
          text = replace_once(text, old_checks, new_checks, 'command metadata ordering')

          decide_end = text.index('    /// Evolve authoritative state from an already accepted/persisted event.')
          extra_decisions = '''    pub fn decide_forfeit(
              &self,
              metadata: CommandMetadata,
              winner: Side,
          ) -> Result<CommandDecision, EventSourcingError> {
              if let Some(version) = self.validate_command_metadata(&metadata)? {
                  return Ok(CommandDecision::AlreadyApplied {
                      aggregate_version: version,
                  });
              }
              if self.state.winner.is_some() {
                  return Err(EventSourcingError::Rule(MatchError::MatchOver));
              }

              Ok(CommandDecision::Append(EventEnvelope {
                  aggregate_version: self.version.next(),
                  event_schema_version: CURRENT_EVENT_SCHEMA_VERSION,
                  ruleset_version: self.ruleset_version.clone(),
                  event: MatchEvent::ForfeitAccepted {
                      command_id: metadata.command_id,
                      winner,
                      action_index: metadata.action_index,
                  },
              }))
          }

          pub fn decide_ai_turn_finished(
              &self,
              metadata: CommandMetadata,
          ) -> Result<CommandDecision, EventSourcingError> {
              if let Some(version) = self.validate_command_metadata(&metadata)? {
                  return Ok(CommandDecision::AlreadyApplied {
                      aggregate_version: version,
                  });
              }

              let mut candidate = self.state.clone();
              candidate.finish_solo_ai_turn_recording(metadata.side, metadata.action_index)?;

              Ok(CommandDecision::Append(EventEnvelope {
                  aggregate_version: self.version.next(),
                  event_schema_version: CURRENT_EVENT_SCHEMA_VERSION,
                  ruleset_version: self.ruleset_version.clone(),
                  event: MatchEvent::AiTurnFinished {
                      command_id: metadata.command_id,
                      side: metadata.side,
                      action_index: metadata.action_index,
                  },
              }))
          }

          '''
          text = text[:decide_end] + extra_decisions + text[decide_end:]

          evolve_start = text.index('    pub fn evolve(\n')
          evolve_end = text.index('    pub fn rehydrate(events: &[EventEnvelope])', evolve_start)
          evolve_block = '''    pub fn evolve(
              &mut self,
              envelope: &EventEnvelope,
          ) -> Result<EvolutionOutcome, EventSourcingError> {
              self.validate_envelope(envelope)?;
              let expected_next = self.version.next();
              if envelope.aggregate_version != expected_next {
                  return Err(EventSourcingError::EventVersionGap {
                      expected: expected_next,
                      actual: envelope.aggregate_version,
                  });
              }

              let command_id = match &envelope.event {
                  MatchEvent::Created { .. } => {
                      return Err(EventSourcingError::UnexpectedGenesisEvent {
                          aggregate_version: envelope.aggregate_version,
                      });
                  }
                  MatchEvent::CommandAccepted { command_id, .. }
                  | MatchEvent::ForfeitAccepted { command_id, .. }
                  | MatchEvent::AiTurnFinished { command_id, .. } => command_id,
              };

              if let Some(existing_version) = self.applied_commands.get(command_id) {
                  return Err(EventSourcingError::DuplicateCommandEvent {
                      command_id: command_id.clone(),
                      first_version: *existing_version,
                      duplicate_version: envelope.aggregate_version,
                  });
              }

              let replay_frames = match &envelope.event {
                  MatchEvent::Created { .. } => unreachable!("genesis rejected above"),
                  MatchEvent::CommandAccepted {
                      side,
                      action_index,
                      command,
                      ..
                  } => command
                      .clone()
                      .execute_compatibility(
                          &mut self.state,
                          CommandContext {
                              side: *side,
                              action_index: *action_index,
                          },
                      )?
                      .replay_frames,
                  MatchEvent::ForfeitAccepted {
                      winner,
                      action_index,
                      ..
                  } => self.state.forfeit_recording(*winner, *action_index),
                  MatchEvent::AiTurnFinished {
                      side,
                      action_index,
                      ..
                  } => self
                      .state
                      .finish_solo_ai_turn_recording(*side, *action_index)?,
              };

              self.version = envelope.aggregate_version;
              self.applied_commands
                  .insert(command_id.clone(), envelope.aggregate_version);

              Ok(EvolutionOutcome { replay_frames })
          }

          '''
          text = text[:evolve_start] + evolve_block + text[evolve_end:]

          text = replace_once(
              text,
              '''        let MatchEvent::Created {
              initial_snapshot_json,
          } = &first.event
          ''',
              '''        let MatchEvent::Created {
              initial_snapshot_json,
              ..
          } = &first.event
          ''',
              'genesis rehydrate pattern',
          )

          validate_marker = '    fn validate_envelope(&self, envelope: &EventEnvelope) -> Result<(), EventSourcingError> {'
          validate_pos = text.index(validate_marker)
          metadata_helper = '''    fn validate_command_metadata(
              &self,
              metadata: &CommandMetadata,
          ) -> Result<Option<AggregateVersion>, EventSourcingError> {
              if let Some(version) = self.applied_commands.get(&metadata.command_id) {
                  return Ok(Some(*version));
              }
              if metadata.expected_version != self.version {
                  return Err(EventSourcingError::VersionConflict {
                      expected: metadata.expected_version,
                      actual: self.version,
                  });
              }
              Ok(None)
          }

          '''
          text = text[:validate_pos] + metadata_helper + text[validate_pos:]
          path.write_text(text)

          # Expose one deterministic AI planning step from core without exposing
          # application scheduling or duplicating policy in the backend.
          path = Path('rune-lanes-core/src/match_session/solo_ai_policy.rs')
          text = path.read_text()
          text = replace_once(
              text,
              'use serde::{Deserialize, Serialize};\n',
              'use serde::{Deserialize, Serialize};\n\nuse crate::cqrs::GameCommand;\nuse super::{MatchError, MatchMode, MatchState, Phase, RecordedReplayFrame};\n',
              'AI command imports',
          )
          marker = '#[derive(Clone, Copy, Debug, Deserialize, Serialize, PartialEq, Eq)]\n#[serde(rename_all = "camelCase")]\npub enum SoloAiRuleId {'
          insert = '''impl MatchState {
              /// Resolve exactly one deterministic solo-AI step into a concrete domain
              /// command. `None` means the policy has no further card-play action and
              /// the caller should record `AiTurnFinished` instead.
              pub fn next_solo_ai_game_command(
                  &self,
                  side: Side,
              ) -> Result<Option<GameCommand>, MatchError> {
                  let policy = SoloAiPolicy::default();
                  self.next_solo_ai_game_command_with_policy(side, &policy)
              }

              pub fn next_solo_ai_game_command_with_policy(
                  &self,
                  side: Side,
                  policy: &SoloAiPolicy,
              ) -> Result<Option<GameCommand>, MatchError> {
                  if self.mode != MatchMode::Solo {
                      return Err(MatchError::AiUnavailable);
                  }
                  if !self.action_stack.is_empty() {
                      if self.priority_side != Some(side) {
                          return Err(MatchError::NotPrioritySide);
                      }
                      return Ok(Some(GameCommand::PassPriority));
                  }
                  if self.active_side != side {
                      return Err(MatchError::AiUnavailable);
                  }

                  let decision = || policy.decide(&self.solo_ai_view_for_side(side));
                  match self.phase {
                      Phase::Movement => {
                          if self.side_has_legal_attack(side) {
                              return Ok(Some(GameCommand::StartAttackPhase));
                          }
                          Ok(Some(match decision() {
                              SoloAiDecision::TakeAction(intent @ SoloAiActionIntent::MovePiece { .. })
                              | SoloAiDecision::TakeAction(intent @ SoloAiActionIntent::ActivateItem { .. }) => {
                                  ai_intent_game_command(intent)
                              }
                              SoloAiDecision::TakeAction(SoloAiActionIntent::Attack { .. }) => {
                                  GameCommand::StartAttackPhase
                              }
                              _ => GameCommand::StartCardPlay,
                          }))
                      }
                      Phase::Attack => Ok(Some(match decision() {
                          SoloAiDecision::TakeAction(intent @ SoloAiActionIntent::Attack { .. })
                          | SoloAiDecision::TakeAction(intent @ SoloAiActionIntent::ActivateItem { .. }) => {
                              ai_intent_game_command(intent)
                          }
                          _ => GameCommand::StartCardPlay,
                      })),
                      Phase::CardPlay => match decision() {
                          SoloAiDecision::TakeAction(intent @ SoloAiActionIntent::PlayCard { .. })
                          | SoloAiDecision::TakeAction(intent @ SoloAiActionIntent::ActivateItem { .. }) => {
                              Ok(Some(ai_intent_game_command(intent)))
                          }
                          _ => Ok(None),
                      },
                      Phase::MatchOver => Err(MatchError::MatchOver),
                  }
              }

              pub fn finish_solo_ai_turn_recording(
                  &mut self,
                  side: Side,
                  action_index: u32,
              ) -> Result<Vec<RecordedReplayFrame>, MatchError> {
                  if self.mode != MatchMode::Solo {
                      return Err(MatchError::AiUnavailable);
                  }
                  if self.active_side != side {
                      return Err(MatchError::AiUnavailable);
                  }
                  self.require_phase(Phase::CardPlay)?;
                  if !self.action_stack.is_empty() {
                      return Err(MatchError::StackPending);
                  }

                  let mut frames = Vec::new();
                  self.finish_ai_turn(side, &mut frames, Some(action_index));
                  self.truncate_log();
                  Ok(frames)
              }
          }

          fn ai_intent_game_command(intent: SoloAiActionIntent) -> GameCommand {
              match intent {
                  SoloAiActionIntent::Attack {
                      attacker_id,
                      target_id,
                  } => GameCommand::Attack {
                      attacker_id,
                      target_id,
                  },
                  SoloAiActionIntent::PlayCard { card_id, target } => {
                      GameCommand::PlayCard { card_id, target }
                  }
                  SoloAiActionIntent::MovePiece { piece_id, to } => {
                      GameCommand::MovePiece { piece_id, to }
                  }
                  SoloAiActionIntent::ActivateItem {
                      carrier_id,
                      item_id,
                      target,
                  } => GameCommand::ActivateItem {
                      carrier_id,
                      item_id,
                      target,
                  },
              }
          }

          '''
          if marker not in text:
              raise SystemExit('AI rule marker not found')
          text = text.replace(marker, insert + marker, 1)
          path.write_text(text)

          # SQLite schema for the authoritative append-only stream and derived snapshots.
          path = Path('backend/src/match_store/schema.rs')
          text = path.read_text()
          marker = '''        CREATE TABLE IF NOT EXISTS shared_matches (
          '''
          tables = '''        CREATE TABLE IF NOT EXISTS match_events (
              match_id TEXT NOT NULL,
              aggregate_version INTEGER NOT NULL,
              event_schema_version INTEGER NOT NULL,
              ruleset_version TEXT NOT NULL,
              command_id TEXT,
              action_index INTEGER,
              event_json TEXT NOT NULL,
              created_at INTEGER NOT NULL DEFAULT (unixepoch()),
              PRIMARY KEY (match_id, aggregate_version)
          );
          CREATE UNIQUE INDEX IF NOT EXISTS match_events_command_id
              ON match_events(match_id, command_id)
              WHERE command_id IS NOT NULL;
          CREATE TABLE IF NOT EXISTS match_event_snapshots (
              match_id TEXT PRIMARY KEY NOT NULL,
              aggregate_version INTEGER NOT NULL,
              snapshot_schema_version INTEGER NOT NULL,
              event_schema_version INTEGER NOT NULL,
              ruleset_version TEXT NOT NULL,
              snapshot_json TEXT NOT NULL,
              updated_at INTEGER NOT NULL DEFAULT (unixepoch())
          );
          '''
          if marker not in text:
              raise SystemExit('schema insertion marker not found')
          text = text.replace(marker, tables + marker, 1)
          text = replace_once(
              text,
              '''            DELETE FROM match_replay_frames;
              DELETE FROM match_actions;
              DELETE FROM match_seats;
          ''',
              '''            DELETE FROM match_event_snapshots;
              DELETE FROM match_events;
              DELETE FROM match_replay_frames;
              DELETE FROM match_actions;
              DELETE FROM match_seats;
          ''',
              'legacy cleanup',
          )
          path.write_text(text)

          # Parent store wiring: keep adapters below the SQLite boundary, seed genesis
          # in the same transaction as new-match projections, and expose fail-closed
          # event-store errors.
          path = Path('backend/src/match_store.rs')
          text = path.read_text()
          text = replace_once(text, 'mod db_values;\n', 'mod db_values;\nmod event_store;\n', 'event-store module')
          text = replace_once(
              text,
              '''    Progression(progression::ProgressionError),
          }
          ''',
              '''    Progression(progression::ProgressionError),
              EventSourcing(rune_lanes_core::event_sourcing::EventSourcingError),
              EventStore(String),
              VersionConflict {
                  expected: rune_lanes_core::event_sourcing::AggregateVersion,
                  actual: rune_lanes_core::event_sourcing::AggregateVersion,
              },
          }
          ''',
              'store error variants',
          )
          text = replace_once(
              text,
              '''            Self::Progression(error) => write!(f, "{error}"),
              }
          ''',
              '''            Self::Progression(error) => write!(f, "{error}"),
                  Self::EventSourcing(error) => write!(f, "event-sourced match failed: {error}"),
                  Self::EventStore(reason) => write!(f, "event store is inconsistent: {reason}"),
                  Self::VersionConflict { expected, actual } => write!(
                      f,
                      "event store version conflict: expected {}, actual {}",
                      expected.0, actual.0
                  ),
              }
          ''',
              'store error display',
          )
          from_marker = '''impl From<progression::ProgressionError> for MatchStoreError {
              fn from(error: progression::ProgressionError) -> Self {
                  Self::Progression(error)
              }
          }
          '''
          from_insert = from_marker + '''
          impl From<rune_lanes_core::event_sourcing::EventSourcingError> for MatchStoreError {
              fn from(error: rune_lanes_core::event_sourcing::EventSourcingError) -> Self {
                  Self::EventSourcing(error)
              }
          }
          '''
          text = replace_once(text, from_marker, from_insert, 'event sourcing error conversion')
          text = text.replace(
              'insert_replay_frame(&transaction, &id, 0, &initial_frame, &event_json)?;\n',
              'insert_replay_frame(&transaction, &id, 0, &initial_frame, &event_json)?;\n                event_store::insert_genesis(&transaction, &id, &state, 0)?;\n',
          )
          text = text.replace(
              'insert_replay_frame(&transaction, id, 0, &initial_frame, &event_json)?;\n',
              'insert_replay_frame(&transaction, id, 0, &initial_frame, &event_json)?;\n                event_store::insert_genesis(&transaction, id, &state, 0)?;\n',
          )
          path.write_text(text)

          event_store = r'''use rusqlite::{OptionalExtension, Transaction, TransactionBehavior, params};
          use rune_lanes_core::MatchState;
          use rune_lanes_core::event_sourcing::{
              AggregateSnapshot, AggregateVersion, EventEnvelope, EventSourcedMatch, MatchEvent,
          };

          use crate::match_session::{RecordedReplayFrame, Side};
          use crate::progression;

          use super::db_values::SideDbValue;
          use super::{MatchStoreError, SqliteMatchStore, insert_replay_frame, next_frame_index};

          const SNAPSHOT_INTERVAL: u64 = 32;

          impl SqliteMatchStore {
              pub(crate) fn load_event_sourced_match(
                  &mut self,
                  id: &str,
              ) -> Result<Option<(EventSourcedMatch, u32)>, MatchStoreError> {
                  self.ensure_event_stream(id)?;

                  let events = load_events(&self.connection, id)?;
                  if events.is_empty() {
                      return Ok(None);
                  }
                  let next_action_index = next_action_index_from_events(&events)?;
                  let snapshot = load_snapshot(&self.connection, id)?;
                  let aggregate = if let Some(snapshot) = snapshot {
                      let last_version = events
                          .last()
                          .map(|event| event.aggregate_version)
                          .ok_or_else(|| MatchStoreError::EventStore("event stream disappeared".to_string()))?;
                      if snapshot.aggregate_version > last_version {
                          return Err(MatchStoreError::EventStore(format!(
                              "snapshot version {} is newer than stream version {} for {id}",
                              snapshot.aggregate_version.0, last_version.0
                          )));
                      }
                      let tail = events
                          .iter()
                          .filter(|event| event.aggregate_version > snapshot.aggregate_version)
                          .cloned()
                          .collect::<Vec<_>>();
                      EventSourcedMatch::rehydrate_from_snapshot(&snapshot, &tail)?
                  } else {
                      EventSourcedMatch::rehydrate(&events)?
                  };

                  Ok(Some((aggregate, next_action_index)))
              }

              #[allow(clippy::too_many_arguments, reason = "atomic event + compatibility projection commit")]
              pub(crate) fn append_event_and_projection(
                  &mut self,
                  id: &str,
                  event: &EventEnvelope,
                  aggregate_snapshot: &AggregateSnapshot,
                  request_json: &str,
                  state: &MatchState,
                  frames: &[RecordedReplayFrame],
                  forfeit_winner: Option<Side>,
              ) -> Result<Option<AggregateVersion>, MatchStoreError> {
                  let expected = AggregateVersion(
                      event
                          .aggregate_version
                          .0
                          .checked_sub(1)
                          .ok_or_else(|| MatchStoreError::EventStore("cannot append aggregate version zero".to_string()))?,
                  );
                  let command_id = event_command_id(event).ok_or_else(|| {
                      MatchStoreError::EventStore("non-genesis event has no command id".to_string())
                  })?;
                  let action_index = event_action_index(event).ok_or_else(|| {
                      MatchStoreError::EventStore("non-genesis event has no action index".to_string())
                  })?;

                  let transaction = self
                      .connection
                      .transaction_with_behavior(TransactionBehavior::Immediate)?;

                  let existing_version = transaction
                      .query_row(
                          "SELECT aggregate_version FROM match_events WHERE match_id = ?1 AND command_id = ?2",
                          params![id, command_id],
                          |row| row.get::<_, i64>(0),
                      )
                      .optional()?;
                  if let Some(existing_version) = existing_version {
                      let existing_version = stored_version(existing_version, id)?;
                      return Ok(Some(existing_version));
                  }

                  let actual_raw = transaction.query_row(
                      "SELECT COALESCE(MAX(aggregate_version), 0) FROM match_events WHERE match_id = ?1",
                      params![id],
                      |row| row.get::<_, i64>(0),
                  )?;
                  let actual = stored_version(actual_raw, id)?;
                  if actual != expected {
                      return Err(MatchStoreError::VersionConflict { expected, actual });
                  }

                  insert_event(&transaction, id, event)?;
                  transaction.execute(
                      "INSERT INTO match_actions (match_id, action_index, request_json, accepted_at) VALUES (?1, ?2, ?3, unixepoch())",
                      params![id, i64::from(action_index), request_json],
                  )?;

                  let next_frame = next_frame_index(&transaction, id)?;
                  for (offset, frame) in frames.iter().enumerate() {
                      let event_json = serde_json::to_string(&frame.event)?;
                      insert_replay_frame(
                          &transaction,
                          id,
                          next_frame + offset as u32,
                          frame,
                          &event_json,
                      )?;
                  }

                  let completed_at = if state.winner.is_some() {
                      "completed_at = COALESCE(completed_at, unixepoch()),"
                  } else {
                      ""
                  };
                  transaction.execute(
                      &format!(
                          "UPDATE matches SET snapshot_json = ?2, {completed_at} updated_at = unixepoch() WHERE id = ?1"
                      ),
                      params![id, aggregate_snapshot.state_snapshot_json],
                  )?;

                  if state.winner.is_some() {
                      if let Some(winner) = forfeit_winner {
                          transaction.execute(
                              "UPDATE shared_matches SET status = 'forfeited', forfeit_winner = ?2, updated_at = unixepoch() WHERE match_id = ?1",
                              params![id, winner.to_db()],
                          )?;
                      } else {
                          transaction.execute(
                              "UPDATE shared_matches SET status = CASE status WHEN 'forfeited' THEN 'forfeited' ELSE 'completed' END, updated_at = unixepoch() WHERE match_id = ?1",
                              params![id],
                          )?;
                      }
                      progression::award_completed_match_in_transaction(&transaction, id)?;
                  }

                  if event.aggregate_version.0 % SNAPSHOT_INTERVAL == 0 || state.winner.is_some() {
                      upsert_snapshot(&transaction, id, aggregate_snapshot)?;
                  }

                  transaction.commit()?;
                  Ok(None)
              }

              fn ensure_event_stream(&mut self, id: &str) -> Result<(), MatchStoreError> {
                  let transaction = self
                      .connection
                      .transaction_with_behavior(TransactionBehavior::Immediate)?;
                  let event_count = transaction.query_row(
                      "SELECT COUNT(*) FROM match_events WHERE match_id = ?1",
                      params![id],
                      |row| row.get::<_, i64>(0),
                  )?;
                  if event_count == 0 {
                      let legacy = transaction
                          .query_row(
                              "SELECT matches.snapshot_json, (SELECT COALESCE(MAX(match_actions.action_index) + 1, 0) FROM match_actions WHERE match_actions.match_id = matches.id) FROM matches WHERE matches.id = ?1",
                              params![id],
                              |row| Ok((row.get::<_, String>(0)?, row.get::<_, i64>(1)?)),
                          )
                          .optional()?;
                      let Some((snapshot_json, next_action_index)) = legacy else {
                          transaction.commit()?;
                          return Ok(());
                      };
                      let next_action_index = u32::try_from(next_action_index).map_err(|_| {
                          MatchStoreError::EventStore(format!("legacy action index is out of range for {id}"))
                      })?;
                      let state = MatchState::from_snapshot_json(&snapshot_json)?;
                      insert_genesis(&transaction, id, &state, next_action_index)?;
                  }
                  transaction.commit()?;
                  Ok(())
              }
          }

          pub(super) fn insert_genesis(
              transaction: &Transaction<'_>,
              id: &str,
              state: &MatchState,
              next_action_index: u32,
          ) -> Result<(), MatchStoreError> {
              let existing = transaction.query_row(
                  "SELECT COUNT(*) FROM match_events WHERE match_id = ?1",
                  params![id],
                  |row| row.get::<_, i64>(0),
              )?;
              if existing != 0 {
                  return Err(MatchStoreError::EventStore(format!(
                      "refusing to replace existing event stream for {id}"
                  )));
              }

              let (aggregate, genesis) = EventSourcedMatch::create_migration_genesis(
                  state.clone(),
                  next_action_index,
              )?;
              insert_event(transaction, id, &genesis)?;
              upsert_snapshot(transaction, id, &aggregate.snapshot()?)?;
              Ok(())
          }

          fn load_events(
              connection: &rusqlite::Connection,
              id: &str,
          ) -> Result<Vec<EventEnvelope>, MatchStoreError> {
              let mut statement = connection.prepare(
                  "SELECT aggregate_version, event_schema_version, ruleset_version, command_id, action_index, event_json FROM match_events WHERE match_id = ?1 ORDER BY aggregate_version",
              )?;
              let mut rows = statement.query(params![id])?;
              let mut events = Vec::new();
              while let Some(row) = rows.next()? {
                  let stored_aggregate = stored_version(row.get::<_, i64>(0)?, id)?;
                  let stored_schema = u16::try_from(row.get::<_, i64>(1)?).map_err(|_| {
                      MatchStoreError::EventStore(format!("event schema version is out of range for {id}"))
                  })?;
                  let stored_ruleset = row.get::<_, String>(2)?;
                  let stored_command_id = row.get::<_, Option<String>>(3)?;
                  let stored_action_index = row
                      .get::<_, Option<i64>>(4)?
                      .map(u32::try_from)
                      .transpose()
                      .map_err(|_| MatchStoreError::EventStore(format!("action index is out of range for {id}")))?;
                  let event_json = row.get::<_, String>(5)?;
                  let event: EventEnvelope = serde_json::from_str(&event_json)?;

                  if event.aggregate_version != stored_aggregate
                      || event.event_schema_version.0 != stored_schema
                      || event.ruleset_version.as_str() != stored_ruleset
                      || event_command_id(&event).map(str::to_owned) != stored_command_id
                      || event_action_index(&event) != stored_action_index
                  {
                      return Err(MatchStoreError::EventStore(format!(
                          "event envelope metadata does not match stored columns for {id} at version {}",
                          stored_aggregate.0
                      )));
                  }
                  events.push(event);
              }
              Ok(events)
          }

          fn load_snapshot(
              connection: &rusqlite::Connection,
              id: &str,
          ) -> Result<Option<AggregateSnapshot>, MatchStoreError> {
              let row = connection
                  .query_row(
                      "SELECT aggregate_version, snapshot_schema_version, event_schema_version, ruleset_version, snapshot_json FROM match_event_snapshots WHERE match_id = ?1",
                      params![id],
                      |row| {
                          Ok((
                              row.get::<_, i64>(0)?,
                              row.get::<_, i64>(1)?,
                              row.get::<_, i64>(2)?,
                              row.get::<_, String>(3)?,
                              row.get::<_, String>(4)?,
                          ))
                      },
                  )
                  .optional()?;
              let Some((aggregate_version, snapshot_schema, event_schema, ruleset, snapshot_json)) = row else {
                  return Ok(None);
              };
              let snapshot: AggregateSnapshot = serde_json::from_str(&snapshot_json)?;
              if snapshot.aggregate_version != stored_version(aggregate_version, id)?
                  || i64::from(snapshot.snapshot_schema_version.0) != snapshot_schema
                  || i64::from(snapshot.event_schema_version.0) != event_schema
                  || snapshot.ruleset_version.as_str() != ruleset
              {
                  return Err(MatchStoreError::EventStore(format!(
                      "snapshot envelope metadata does not match stored columns for {id}"
                  )));
              }
              Ok(Some(snapshot))
          }

          fn insert_event(
              transaction: &Transaction<'_>,
              id: &str,
              event: &EventEnvelope,
          ) -> Result<(), MatchStoreError> {
              let event_json = serde_json::to_string(event)?;
              transaction.execute(
                  "INSERT INTO match_events (match_id, aggregate_version, event_schema_version, ruleset_version, command_id, action_index, event_json, created_at) VALUES (?1, ?2, ?3, ?4, ?5, ?6, ?7, unixepoch())",
                  params![
                      id,
                      i64::try_from(event.aggregate_version.0).map_err(|_| MatchStoreError::EventStore("aggregate version exceeds SQLite integer range".to_string()))?,
                      i64::from(event.event_schema_version.0),
                      event.ruleset_version.as_str(),
                      event_command_id(event),
                      event_action_index(event).map(i64::from),
                      event_json,
                  ],
              )?;
              Ok(())
          }

          fn upsert_snapshot(
              transaction: &Transaction<'_>,
              id: &str,
              snapshot: &AggregateSnapshot,
          ) -> Result<(), MatchStoreError> {
              let snapshot_json = serde_json::to_string(snapshot)?;
              transaction.execute(
                  "INSERT INTO match_event_snapshots (match_id, aggregate_version, snapshot_schema_version, event_schema_version, ruleset_version, snapshot_json, updated_at) VALUES (?1, ?2, ?3, ?4, ?5, ?6, unixepoch()) ON CONFLICT(match_id) DO UPDATE SET aggregate_version = excluded.aggregate_version, snapshot_schema_version = excluded.snapshot_schema_version, event_schema_version = excluded.event_schema_version, ruleset_version = excluded.ruleset_version, snapshot_json = excluded.snapshot_json, updated_at = unixepoch()",
                  params![
                      id,
                      i64::try_from(snapshot.aggregate_version.0).map_err(|_| MatchStoreError::EventStore("snapshot aggregate version exceeds SQLite integer range".to_string()))?,
                      i64::from(snapshot.snapshot_schema_version.0),
                      i64::from(snapshot.event_schema_version.0),
                      snapshot.ruleset_version.as_str(),
                      snapshot_json,
                  ],
              )?;
              Ok(())
          }

          fn event_command_id(event: &EventEnvelope) -> Option<&str> {
              match &event.event {
                  MatchEvent::Created { .. } => None,
                  MatchEvent::CommandAccepted { command_id, .. }
                  | MatchEvent::ForfeitAccepted { command_id, .. }
                  | MatchEvent::AiTurnFinished { command_id, .. } => Some(command_id.as_str()),
              }
          }

          fn event_action_index(event: &EventEnvelope) -> Option<u32> {
              match &event.event {
                  MatchEvent::Created { .. } => None,
                  MatchEvent::CommandAccepted { action_index, .. }
                  | MatchEvent::ForfeitAccepted { action_index, .. }
                  | MatchEvent::AiTurnFinished { action_index, .. } => Some(*action_index),
              }
          }

          fn next_action_index_from_events(events: &[EventEnvelope]) -> Result<u32, MatchStoreError> {
              let Some(first) = events.first() else {
                  return Err(MatchStoreError::EventStore("event stream is empty".to_string()));
              };
              let MatchEvent::Created {
                  next_action_index,
                  ..
              } = first.event
              else {
                  return Err(MatchStoreError::EventStore("event stream is missing genesis".to_string()));
              };
              let mut next = next_action_index;
              for event in &events[1..] {
                  let Some(action_index) = event_action_index(event) else {
                      return Err(MatchStoreError::EventStore("non-genesis event is missing action index".to_string()));
                  };
                  next = next.max(action_index.checked_add(1).ok_or_else(|| {
                      MatchStoreError::EventStore("action index overflow".to_string())
                  })?);
              }
              Ok(next)
          }

          fn stored_version(value: i64, id: &str) -> Result<AggregateVersion, MatchStoreError> {
              let value = u64::try_from(value).map_err(|_| {
                  MatchStoreError::EventStore(format!("negative aggregate version stored for {id}"))
              })?;
              Ok(AggregateVersion(value))
          }

