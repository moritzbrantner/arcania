name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.3
    with:
      bun_version: 1.3.13
      pre_command: rustup toolchain install 1.98 --profile minimal && rustup default 1.98
      build_command: bun run build
      unit_test_command: bun run test
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      concurrency_group: ci-validation-${{ github.ref }}
