name: Validate

on:
  # Full PR/main validation already runs in ci.yml; keep this faster subset opt-in.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@3b15546083e66aeba487a2e653e3ffaacbfe7220 # workflow-standard-v1.3
    with:
      bun_version: latest
      pre_command: rustup toolchain install stable --profile minimal && rustup default stable
      build_command: bun run build
      unit_test_command: bun run test
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      concurrency_group: ci-validation-${{ github.ref }}
