[workspace]
members = ["backend", "rune-lanes-core"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rune-lanes-core = { path = "rune-lanes-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settings-core = { git = "https://github.com/moritzbrantner/settings", rev = "da2f9c2eaa1ad0633ea787a03023d87daed6902a" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
