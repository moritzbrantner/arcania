[workspace]
members = ["backend", "rune-lanes-core"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "5d62ddd7d612535a3e7fc5761af20330837c87b4" }
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rune-lanes-core = { path = "rune-lanes-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
